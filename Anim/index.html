<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escena animada con GSAP y Howler.js</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }

  h1 {
    color: #f5f5f5;
    font-size: 18px;
    letter-spacing: 1px;
    margin: 0 0 8px;
  }

  p.hint {
    color: #7a8a94;
    font-size: 13px;
    margin: 0 0 30px;
    text-align: center;
  }

  .stage {
    position: relative;
    width: 480px;
    height: 320px;
    background: #101820;
    border-radius: 20px;
    border: 1px solid #2a3a44;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .shape {
    position: absolute;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #101820;
    font-weight: 700;
    font-size: 12px;
  }

  .shape.circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #f5c518;
    top: 40px;
    left: 60px;
  }

  .shape.square {
    width: 55px;
    height: 55px;
    border-radius: 10px;
    background: #4caf50;
    top: 200px;
    left: 120px;
  }

  .shape.triangle {
    width: 0;
    height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-bottom: 55px solid #3ea6ff;
    background: transparent;
    top: 60px;
    left: 260px;
  }

  .shape.diamond {
    width: 50px;
    height: 50px;
    background: #e05353;
    top: 190px;
    left: 360px;
    transform: rotate(45deg);
  }

  .controls {
    margin-top: 24px;
    display: flex;
    gap: 14px;
  }

  button {
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    color: #101820;
    background: #f5c518;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.08s, opacity 0.15s;
  }

  button:hover {
    opacity: 0.9;
  }

  button:active {
    transform: scale(0.95);
  }

  button.secondary {
    background: #1c2b34;
    color: #f5f5f5;
    border: 1px solid #2f3f49;
  }

  .msg {
    margin-top: 16px;
    color: #7a8a94;
    font-size: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>

<h1>Escena animada</h1>
<p class="hint">Haz clic en cada figura para animarla y reproducir un sonido.<br>Usa "Reproducir secuencia" para animarlas todas juntas.</p>

<div class="stage">
  <div class="shape circle" id="circle"></div>
  <div class="shape square" id="square"></div>
  <div class="shape triangle" id="triangle"></div>
  <div class="shape diamond" id="diamond"></div>
</div>

<div class="controls">
  <button id="btnSequence">Reproducir secuencia</button>
  <button class="secondary" id="btnReset">Reiniciar escena</button>
</div>

<div class="msg" id="msg">GreenSock (GSAP) para animación · Howler.js para sonido</div>

  const shapes = ['circle', 'square', 'triangle', 'diamond'].map(id => document.getElementById(id));
  const msgEl = document.getElementById('msg');

  const basePositions = shapes.map(el => ({ el, x: 0, y: 0, rotation: el.id === 'diamond' ? 45 : 0 }));

  // Animación ambiental: flotan suavemente en el eje X de forma infinita
  // (usa X en vez de Y para no chocar con las animaciones de clic/secuencia, que mueven Y)
  function startIdleFloat() {
    shapes.forEach((el, i) => {
      gsap.to(el, {
        x: '+=12',
        duration: 1.6 + i * 0.2,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });
    });
  }

  startIdleFloat();

  // Clic individual: giro + salto + sonido
  shapes.forEach(el => {
    el.addEventListener('click', () => {
      shapeSounds[el.id].play();
      gsap.to(el, {
        rotation: (el._extraSpin = (el._extraSpin || 0) + 360),
        scale: 1.3,
        duration: 0.35,
        ease: 'back.out(2)',
        yoyo: true,
        repeat: 1
      });
      setMsg(el.id + ' animado ✔ (GSAP + Howler.js)');
    });
  });

  document.getElementById('btnSequence').addEventListener('click', () => {
    const tl = gsap.timeline({
      onComplete: () => {
        successSound.play();
        setMsg('Secuencia completa ✔');
      }
    });

    shapes.forEach((el, i) => {
      tl.to(el, {
        y: '-=40',
        scale: 1.2,
        duration: 0.4,
        ease: 'power2.out',
        onStart: () => shapeSounds[el.id].play()
      }, i * 0.15)
      .to(el, {
        y: '+=40',
        scale: 1,
        duration: 0.4,
        ease: 'bounce.out'
      }, i * 0.15 + 0.4);
    });

    setMsg('Reproduciendo secuencia...');
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    shapes.forEach(el => {
      el._extraSpin = 0;
      gsap.to(el, {
        x: 0,
        y: 0,
        scale: 1,
        rotation: el.id === 'diamond' ? 45 : 0,
        duration: 0.4
      });
    });
    gsap.delayedCall(0.4, startIdleFloat);
    setMsg('Escena reiniciada');
  });

  function setMsg(text) {
    msgEl.textContent = text;
  }
</script>
